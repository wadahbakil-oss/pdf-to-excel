<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول PDF إلى Excel - للتقارير المالية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0f5b4a, #1a7f64);
            color: white;
            padding: 28px 32px;
        }
        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }
        .header p {
            margin: 0;
            opacity: 0.9;
        }
        .content {
            padding: 32px;
        }
        .upload-area {
            background: #fafcff;
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .upload-area:hover {
            border-color: #1a7f64;
            background: #f0fdf9;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        button {
            background: #1a7f64;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        button:hover {
            background: #0e5e48;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #475569;
        }
        .btn-secondary:hover {
            background: #334155;
        }
        .btn-danger {
            background: #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .status {
            background: #f1f5f9;
            padding: 14px 20px;
            border-radius: 16px;
            margin: 16px 0;
            font-size: 0.9rem;
            border-right: 4px solid #1a7f64;
        }
        .status.error {
            border-right-color: #dc2626;
            background: #fef2f2;
        }
        .status.success {
            border-right-color: #22c55e;
            background: #f0fdf4;
        }
        .preview-table {
            overflow-x: auto;
            max-height: 550px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            text-align: right;
        }
        th {
            background: #f8fafc;
            font-weight: 700;
            position: sticky;
            top: 0;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 16px;
            font-size: 0.85rem;
        }
        .badge {
            background: #e6f7ec;
            color: #1a7f64;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .file-info {
            background: #eef2ff;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📄 محول PDF ➜ Excel</h1>
        <p>لتقارير عيادة الأسنان - مدين، دائن، الرصيد</p>
    </div>
    <div class="content">
        <div class="upload-area" id="dropZone">
            <div style="font-size: 56px; margin-bottom: 12px;">📂</div>
            <div style="font-weight: 600; font-size: 1.1rem;">اسحب ملف PDF هنا أو انقر للاختيار</div>
            <div style="font-size: 13px; margin-top: 8px; color: #64748b;">يدعم ملفات تقارير عيادة الأسنان (A_MOVMENT_C_ALL_SUMMERY.pdf)</div>
            <input type="file" id="fileInput" accept=".pdf" style="display: none;">
        </div>
        
        <div class="btn-group">
            <button id="convertBtn" disabled>📊 تصدير إلى Excel</button>
            <button id="sampleBtn" class="btn-secondary">📋 تجربة (بيانات وهمية)</button>
            <button id="clearBtn" class="btn-danger">🗑 مسح الكل</button>
        </div>
        
        <div id="statusMsg" class="status">✔️ جاهز لاستقبال ملف PDF</div>
        <div id="fileInfo" class="file-info" style="display: none;"></div>
        
        <div id="previewContainer">
            <div style="font-weight: 600; margin-bottom: 10px;">📋 معاينة البيانات المستخرجة</div>
            <div class="preview-table" id="tablePreview">
                <div style="padding: 50px; text-align: center; color: #94a3b8;">📭 انتظر رفع ملف PDF لعرض البيانات</div>
            </div>
        </div>
        <div id="statsArea" class="stats" style="display: none;"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    
    let currentRows = [];
    let currentFile = "";
    
    function showStatus(msg, type = 'info') {
        const el = document.getElementById('statusMsg');
        el.innerHTML = msg;
        el.className = `status ${type === 'error' ? 'error' : (type === 'success' ? 'success' : '')}`;
    }
    
    function toEnglishNumber(str) {
        if (!str) return "0";
        const arabicDigits = '٠١٢٣٤٥٦٧٨٩';
        const persianDigits = '۰۱۲۳۴۵۶۷۸۹';
        let result = str.toString();
        for (let i = 0; i < 10; i++) {
            result = result.replace(new RegExp(arabicDigits[i], 'g'), i.toString());
            result = result.replace(new RegExp(persianDigits[i], 'g'), i.toString());
        }
        return result;
    }
    
    function parseNumber(str) {
        if (!str) return 0;
        let cleaned = toEnglishNumber(str.trim());
        cleaned = cleaned.replace(/,/g, '').replace(/٬/g, '');
        let match = cleaned.match(/-?\d+(?:\.\d+)?/);
        if (!match) return 0;
        let num = parseFloat(match[0]);
        return isNaN(num) ? 0 : num;
    }
    
    // استخراج البيانات من نص PDF (حتى لو كان يحتوي على HTML)
    function extractDataFromText(text) {
        const rows = [];
        const lines = text.split(/\r?\n/);
        
        // الحالة 1: البحث عن نمط: رقم العميل + اسم + 3 أرقام (مدين, دائن, رصيد)
        // هذا النمط موجود في الملف A_MOVMENT_C_ALL_SUMMERY.pdf
        const pattern1 = /(\d+)\s+([\u0600-\u06FF\u0750-\u077F\s\.\-]+?)\s+([\d,\.\-]+)\s+([\d,\.\-]+)\s+([\d,\.\-]+)/g;
        
        let match;
        while ((match = pattern1.exec(text)) !== null) {
            let name = match[2].trim();
            let debit = parseNumber(match[3]);
            let credit = parseNumber(match[4]);
            let balance = parseNumber(match[5]);
            
            if (name.length > 0 && name.length < 100 && !name.includes('اجمالي') && !name.includes('الرصيد')) {
                rows.push({
                    "رقم العميل": match[1],
                    "اسم العميل": name,
                    "مدين (YER)": debit,
                    "دائن (YER)": credit,
                    "الرصيد (YER)": balance
                });
            }
        }
        
        // الحالة 2: إذا لم نجد شيئاً، جرب تقسيم السطور مباشرة
        if (rows.length === 0) {
            for (let line of lines) {
                line = line.trim();
                if (line.length < 15) continue;
                if (line.includes('اجمالي') || line.includes('الرصيد') || line.includes('Page') || 
                    line.includes('المدير') || line.includes('تلفون') || line.includes('فاكس')) {
                    continue;
                }
                
                let parts = line.split(/\s+/);
                if (parts.length >= 5) {
                    let firstNum = parseNumber(parts[0]);
                    if (firstNum > 0 || parts[0] === '0') {
                        let lastThree = parts.slice(-3);
                        let nums = lastThree.map(p => parseNumber(p));
                        if (nums.every(n => !isNaN(n))) {
                            let nameParts = parts.slice(1, -3);
                            let name = nameParts.join(' ');
                            name = name.replace(/[`~!@#$%^&*()_+=[\]{};':"\\|,.<>/?]/g, '');
                            if (name.length > 0 && name.length < 100 && !name.includes('مدين')) {
                                rows.push({
                                    "رقم العميل": parts[0],
                                    "اسم العميل": name,
                                    "مدين (YER)": nums[0],
                                    "دائن (YER)": nums[1],
                                    "الرصيد (YER)": nums[2]
                                });
                            }
                        }
                    }
                }
            }
        }
        
        // إزالة التكرارات
        const unique = [];
        const seen = new Set();
        for (let row of rows) {
            const key = `${row["رقم العميل"]}|${row["اسم العميل"]}`;
            if (!seen.has(key) && row["اسم العميل"].length > 1) {
                seen.add(key);
                unique.push(row);
            }
        }
        
        return unique;
    }
    
    async function processPDF(file) {
        if (!file || file.type !== 'application/pdf') {
            showStatus('❌ يرجى اختيار ملف PDF صالح', 'error');
            return false;
        }
        
        showStatus(`⏳ جاري معالجة: ${file.name} ...`);
        document.getElementById('fileInfo').style.display = 'block';
        document.getElementById('fileInfo').innerHTML = `📄 الملف: ${file.name} | الحجم: ${(file.size / 1024).toFixed(2)} KB`;
        
        try {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            
            let allText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const strings = content.items.map(item => item.str);
                allText += strings.join(' ') + '\n';
            }
            
            // محاولة استخراج البيانات
            let rows = extractDataFromText(allText);
            
            // إذا لم نجد بيانات، جرب معالجة النص الخام بدون تنظيف
            if (rows.length === 0) {
                const rawText = allText.replace(/\s+/g, ' ');
                rows = extractDataFromText(rawText);
            }
            
            if (rows.length === 0) {
                showStatus('⚠️ لم يتم العثور على بيانات جدولية في هذا الملف', 'error');
                document.getElementById('tablePreview').innerHTML = '<div style="padding: 50px; text-align: center;">❌ لم يتم العثور على جداول عملاء في هذا الملف</div>';
                document.getElementById('statsArea').style.display = 'none';
                document.getElementById('convertBtn').disabled = true;
                return false;
            }
            
            currentRows = rows;
            currentFile = file.name.replace(/\.pdf$/i, '');
            
            displayPreview(rows);
            showStatus(`✅ تم استخراج ${rows.length} سجل بنجاح!`, 'success');
            document.getElementById('convertBtn').disabled = false;
            
            const totalDebit = rows.reduce((s, r) => s + r["مدين (YER)"], 0);
            const totalCredit = rows.reduce((s, r) => s + r["دائن (YER)"], 0);
            const totalBalance = rows.reduce((s, r) => s + r["الرصيد (YER)"], 0);
            document.getElementById('statsArea').innerHTML = `📊 إجمالي المدين: ${totalDebit.toFixed(2)} | إجمالي الدائن: ${totalCredit.toFixed(2)} | إجمالي الرصيد: ${totalBalance.toFixed(2)} | عدد العملاء: ${rows.length}`;
            document.getElementById('statsArea').style.display = 'flex';
            
            return true;
            
        } catch (err) {
            console.error(err);
            showStatus(`❌ خطأ: ${err.message}`, 'error');
            return false;
        }
    }
    
    function displayPreview(rows) {
        const container = document.getElementById('tablePreview');
        if (!rows || rows.length === 0) {
            container.innerHTML = '<div style="padding: 50px; text-align: center;">📭 لا توجد بيانات</div>';
            return;
        }
        
        let html = '<table dir="rtl"><thead><tr>';
        html += '<th>#</th><th>رقم العميل</th><th>اسم العميل</th><th>مدين (YER)</th><th>دائن (YER)</th><th>الرصيد (YER)</th>';
        html += '</tr></thead><tbody>';
        
        rows.slice(0, 50).forEach((row, idx) => {
            html += `<tr>
                        <td>${idx + 1}</td>
                        <td>${escapeHtml(row["رقم العميل"])}</td>
                        <td>${escapeHtml(row["اسم العميل"])}</td>
                        <td style="text-align:left">${row["مدين (YER)"].toLocaleString()}</td>
                        <td style="text-align:left">${row["دائن (YER)"].toLocaleString()}</td>
                        <td style="text-align:left">${row["الرصيد (YER)"].toLocaleString()}</td>
                     </tr>`;
        });
        
        html += '</tbody></table>';
        if (rows.length > 50) {
            html += `<div style="padding: 12px; background: #f8fafc; text-align: center;">+ ${rows.length - 50} صف إضافي</div>`;
        }
        container.innerHTML = html;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function exportToExcel() {
        if (!currentRows || currentRows.length === 0) {
            showStatus('لا توجد بيانات للتصدير', 'error');
            return;
        }
        
        const sheetData = [["رقم العميل", "اسم العميل", "مدين (YER)", "دائن (YER)", "الرصيد (YER)"]];
        let totalDebit = 0, totalCredit = 0, totalBalance = 0;
        
        for (let row of currentRows) {
            sheetData.push([
                row["رقم العميل"],
                row["اسم العميل"],
                row["مدين (YER)"],
                row["دائن (YER)"],
                row["الرصيد (YER)"]
            ]);
            totalDebit += row["مدين (YER)"];
            totalCredit += row["دائن (YER)"];
            totalBalance += row["الرصيد (YER)"];
        }
        
        sheetData.push(["", "الإجمالي", totalDebit, totalCredit, totalBalance]);
        
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        ws['!cols'] = [{wch:12}, {wch:35}, {wch:16}, {wch:16}, {wch:16}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "العملاء");
        XLSX.writeFile(wb, `${currentFile || "report"}_clients_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.xlsx`);
        
        showStatus(`✅ تم التصدير! تم حفظ ${currentRows.length} عميل`, 'success');
    }
    
    function loadSampleData() {
        currentRows = [
            {"رقم العميل":"6","اسم العميل":"عبدالله المروسي","مدين (YER)":2250,"دائن (YER)":0,"الرصيد (YER)":2250},
            {"رقم العميل":"12","اسم العميل":"عبدالله الحكيمي","مدين (YER)":3000,"دائن (YER)":3000,"الرصيد (YER)":-3000},
            {"رقم العميل":"51","اسم العميل":"ناصر العتمي","مدين (YER)":2500,"دائن (YER)":2000,"الرصيد (YER)":2500},
            {"رقم العميل":"93","اسم العميل":"عبدالله شيبان","مدين (YER)":2400,"دائن (YER)":0,"الرصيد (YER)":2400},
            {"رقم العميل":"110","اسم العميل":"حسن الطباخ","مدين (YER)":8050,"دائن (YER)":0,"الرصيد (YER)":8050},
            {"رقم العميل":"146","اسم العميل":"لطف محمد قاسم","مدين (YER)":5820,"دائن (YER)":0,"الرصيد (YER)":5820},
            {"رقم العميل":"228","اسم العميل":"ام براءه","مدين (YER)":7500,"دائن (YER)":0,"الرصيد (YER)":7500},
            {"رقم العميل":"311","اسم العميل":"ام محمد ضمانة اختيار","مدين (YER)":3950,"دائن (YER)":0,"الرصيد (YER)":3950},
            {"رقم العميل":"315","اسم العميل":"محمد نجيب صاحب البطاط","مدين (YER)":5200,"دائن (YER)":0,"الرصيد (YER)":5200},
            {"رقم العميل":"322","اسم العميل":"مروان سيف","مدين (YER)":200,"دائن (YER)":0,"الرصيد (YER)":200}
        ];
        currentFile = "sample_data";
        displayPreview(currentRows);
        showStatus(`📋 تم تحميل ${currentRows.length} سجل تجريبي (محاكاة للملف الأول)`, 'success');
        document.getElementById('convertBtn').disabled = false;
        document.getElementById('statsArea').innerHTML = `📊 إجمالي المدين: 38270 | إجمالي الدائن: 5000 | عدد العملاء: ${currentRows.length}`;
        document.getElementById('statsArea').style.display = 'flex';
        document.getElementById('fileInfo').style.display = 'block';
        document.getElementById('fileInfo').innerHTML = `📋 بيانات تجريبية مستوحاة من ملف A_MOVMENT_C_ALL_SUMMERY.pdf`;
    }
    
    function clearAll() {
        currentRows = [];
        currentFile = "";
        document.getElementById('tablePreview').innerHTML = '<div style="padding: 50px; text-align: center;">📭 تم المسح، اختر ملف PDF جديد</div>';
        document.getElementById('statsArea').style.display = 'none';
        document.getElementById('fileInfo').style.display = 'none';
        document.getElementById('convertBtn').disabled = true;
        document.getElementById('fileInput').value = '';
        showStatus('🗑️ تم مسح جميع البيانات. يمكنك الآن رفع ملف جديد.', 'info');
    }
    
    // ربط الأحداث
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) processPDF(e.target.files[0]);
    });
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#1a7f64';
        dropZone.style.background = '#f0fdf9';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafcff';
    });
    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafcff';
        const files = e.dataTransfer.files;
        if (files.length && files[0].type === 'application/pdf') {
            await processPDF(files[0]);
        } else {
            showStatus('❌ يرجى إسقاط ملف PDF فقط', 'error');
        }
    });
    
    document.getElementById('convertBtn').addEventListener('click', exportToExcel);
    document.getElementById('sampleBtn').addEventListener('click', loadSampleData);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
</script>
</body>
</html>
