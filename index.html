<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول PDF إلى Excel - خاص بعيادة الأسنان</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            font-family: 'Cairo', 'Segoe UI', system-ui;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0a3c32, #1a7f64);
            color: white;
            padding: 28px 32px;
        }
        .header h1 { margin: 0 0 8px; font-size: 1.8rem; }
        .content { padding: 32px; }
        .upload-area {
            background: #fafcff;
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .upload-area:hover { border-color: #1a7f64; background: #f0fdf9; }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        button {
            background: #1a7f64;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button:hover { background: #0e5e48; transform: translateY(-1px); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #475569; }
        .btn-danger { background: #dc2626; }
        .status {
            background: #f1f5f9;
            padding: 14px 20px;
            border-radius: 16px;
            margin: 16px 0;
            border-right: 4px solid #1a7f64;
        }
        .status.error { border-right-color: #dc2626; background: #fef2f2; }
        .status.success { border-right-color: #22c55e; background: #f0fdf4; }
        .preview-table {
            overflow-x: auto;
            max-height: 550px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            text-align: right;
        }
        th {
            background: #f1f5f9;
            position: sticky;
            top: 0;
        }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 16px;
        }
        .success-badge {
            color: #16a34a;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📄 محول PDF إلى Excel</h1>
        <p>خاص بملفات عيادة الأسنان - تعز</p>
    </div>
    <div class="content">
        <div class="upload-area" id="dropZone">
            <div style="font-size: 56px;">📂</div>
            <div style="font-weight: 600;">اسحب ملف PDF هنا أو انقر للاختيار</div>
            <div style="font-size: 13px; color: #64748b;">✅ يدعم: A_MOVMENT_C_ALL_SUMMERY.pdf و A_MOVMENT_SUM4ERY.pdf</div>
            <input type="file" id="fileInput" accept=".pdf" style="display: none;">
        </div>
        
        <div class="btn-group">
            <button id="convertBtn" disabled>📊 تصدير إلى Excel</button>
            <button id="clearBtn" class="btn-danger">🗑 مسح</button>
        </div>
        
        <div id="statusMsg" class="status">✔️ جاهز. اختر ملف PDF.</div>
        
        <div class="preview-table" id="tablePreview">
            <div style="padding: 50px; text-align: center;">📭 سيظهر الجدول بعد رفع الملف</div>
        </div>
        <div id="statsArea" class="stats" style="display: none;"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    
    let clientsData = [];
    let fileName = "";
    
    function showStatus(msg, type = 'info') {
        const el = document.getElementById('statusMsg');
        el.innerHTML = msg;
        el.className = `status ${type === 'error' ? 'error' : (type === 'success' ? 'success' : '')}`;
    }
    
    function normalizeArabicNumbers(str) {
        if (!str) return "0";
        const arabic = '٠١٢٣٤٥٦٧٨٩';
        const persian = '۰۱۲۳۴۵۶۷۸۹';
        let result = String(str);
        for (let i = 0; i < 10; i++) {
            result = result.replace(new RegExp(arabic[i], 'g'), String(i));
            result = result.replace(new RegExp(persian[i], 'g'), String(i));
        }
        return result;
    }
    
    function extractNumber(str) {
        if (!str) return 0;
        let cleaned = normalizeArabicNumbers(str.trim());
        cleaned = cleaned.replace(/,/g, '').replace(/٬/g, '');
        let match = cleaned.match(/-?\d+(?:\.\d+)?/);
        if (!match) return 0;
        let num = parseFloat(match[0]);
        return isNaN(num) ? 0 : num;
    }
    
    // الخوارزمية المخصصة للملفات
    function extractClientsFromPDFText(text) {
        const clients = [];
        
        // تقسيم النص إلى سطور
        const lines = text.split(/\r?\n/);
        
        // قائمة الكلمات التي يجب تجاهلها
        const skipWords = ['اجمالي', 'الإجمالي', 'المدير', 'Page', 'تلفون', 'فاكس', 
                          'تعز', 'الحوبان', 'دنتل', 'العملاء', 'الرصيد الحالي',
                          'لرصيد', 'دائن', 'مدين', 'الرصيد', 'صفحة', 'طبع بواسطة'];
        
        // قائمة الأسماء الصحيحة المسموح بها (للتأكد)
        const validNames = ['عبدالله', 'ناصر', 'وليد', 'حسن', 'لطف', 'ام', 'محمد', 'مروان',
                           'فيصل', 'فهمي', 'ادم', 'ناجي', 'عيادة', 'طاهر', 'هارون', 'علي',
                           'جميل', 'امين', 'هاني', 'زيد', 'منصور', 'عبدالعزيز', 'انور',
                           'ياسر', 'عاقل', 'صالح', 'صبحي', 'اياد', 'سامي', 'عمار', 'هيثم',
                           'جواد', 'عمران', 'حامد', 'عدنان', 'عبدالفتاح', 'ماجد', 'توفيق',
                           'زكي', 'ربيع', 'حميري', 'ايمن', 'بشير', 'حمود', 'مويد', 'ابو',
                           'الشيخ', 'عليف', 'بزيد', 'عبدالكريم', 'احمد', 'فؤاد', 'رضون',
                           'ابراهيم', 'عزام', 'حمزه', 'نصر', 'طارق', 'نبيل', 'فتح', 'شرعي',
                           'كمال', 'شيبان', 'عصام'];
        
        for (let line of lines) {
            line = line.trim();
            if (line.length < 20) continue;
            
            // تخطي السطور التي تحتوي كلمات ممنوعة
            let shouldSkip = false;
            for (let word of skipWords) {
                if (line.includes(word)) {
                    shouldSkip = true;
                    break;
                }
            }
            if (shouldSkip) continue;
            
            // البحث عن نمط: رقم + اسم + أرقام
            // الملف الأول: "6عبدالله المروسي2,250.000.002,250.00"
            // الملف الثاني: "6عبدالله المروسي2,250.00 0.00 2,250.00"
            
            // استخراج الأرقام أولاً
            let numbers = [];
            let numMatches = line.match(/-?\d{1,3}(?:[,٬]\d{3})*(?:\.\d+)?/g);
            if (numMatches) {
                numbers = numMatches.map(n => extractNumber(n));
            }
            
            // استخراج الأرقام متصلة (مثل 2,250.000.002,250.00)
            let connectedMatch = line.match(/(\d{1,3}(?:[,٬]\d{3})*\.\d{3})(\d{1,3}(?:[,٬]\d{3})*\.\d{2})/);
            if (connectedMatch && numbers.length < 3) {
                numbers = [
                    extractNumber(connectedMatch[1]),
                    extractNumber(connectedMatch[2]),
                    0
                ];
            }
            
            if (numbers.length >= 2) {
                // محاولة استخراج اسم العميل
                let name = "";
                let clientId = "";
                
                // البحث عن رقم العميل (بداية السطر)
                let idMatch = line.match(/^(\d+)/);
                if (idMatch) {
                    clientId = idMatch[1];
                }
                
                // استخراج الاسم (النص بين رقم العميل والأرقام)
                let afterId = line.replace(/^\d+/, '');
                if (numbers.length >= 2 && afterId) {
                    // البحث عن أول رقم في النص المتبقي
                    let firstNumberIndex = -1;
                    for (let i = 0; i < afterId.length; i++) {
                        if ('0123456789٠١٢٣٤٥٦٧٨٩'.includes(afterId[i])) {
                            firstNumberIndex = i;
                            break;
                        }
                    }
                    if (firstNumberIndex > 0) {
                        name = afterId.substring(0, firstNumberIndex).trim();
                    } else {
                        name = afterId.trim();
                    }
                    
                    // تنظيف الاسم
                    name = name.replace(/[0-9٠-٩]/g, '').trim();
                    name = name.replace(/\s+/g, ' ');
                }
                
                // التحقق من صحة الاسم
                let isValidName = name.length >= 2 && name.length < 60;
                if (isValidName && clientId && clientId.length < 5) {
                    let debit = numbers[0] || 0;
                    let credit = numbers[1] || 0;
                    let balance = numbers[2] !== undefined ? numbers[2] : debit - credit;
                    
                    // تجنب التكرارات
                    const exists = clients.some(c => c["رقم العميل"] === clientId && c["اسم العميل"] === name);
                    if (!exists && !name.includes('الرصيد') && !name.includes('مدين')) {
                        clients.push({
                            "رقم العميل": clientId,
                            "اسم العميل": name,
                            "مدين (YER)": debit,
                            "دائن (YER)": credit,
                            "الرصيد (YER)": balance
                        });
                    }
                }
            }
        }
        
        // إزالة التكرارات
        const unique = [];
        const seen = new Set();
        for (let c of clients) {
            const key = `${c["رقم العميل"]}|${c["اسم العميل"]}`;
            if (!seen.has(key) && c["اسم العميل"].length > 1 && !c["اسم العميل"].includes('الرصيد')) {
                seen.add(key);
                unique.push(c);
            }
        }
        
        return unique;
    }
    
    async function processPDF(file) {
        if (!file || file.type !== 'application/pdf') {
            showStatus('❌ يرجى اختيار ملف PDF صالح', 'error');
            return false;
        }
        
        showStatus(`⏳ جاري معالجة: ${file.name} ...`);
        
        try {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageText = content.items.map(item => item.str).join(' ');
                fullText += pageText + '\n';
            }
            
            let clients = extractClientsFromPDFText(fullText);
            
            if (clients.length === 0) {
                showStatus('⚠️ لم يتم العثور على بيانات. تأكد أن الملف يحتوي على جدول عملاء.', 'error');
                document.getElementById('tablePreview').innerHTML = '<div style="padding: 50px; text-align: center;">❌ لم يتم العثور على بيانات</div>';
                document.getElementById('statsArea').style.display = 'none';
                document.getElementById('convertBtn').disabled = true;
                return false;
            }
            
            clientsData = clients;
            fileName = file.name.replace(/\.pdf$/i, '');
            
            displayTable(clients);
            showStatus(`✅ تم استخراج ${clients.length} عميل بنجاح!`, 'success');
            document.getElementById('convertBtn').disabled = false;
            
            const totalDebit = clients.reduce((s, c) => s + c["مدين (YER)"], 0);
            const totalCredit = clients.reduce((s, c) => s + c["دائن (YER)"], 0);
            const totalBalance = clients.reduce((s, c) => s + c["الرصيد (YER)"], 0);
            document.getElementById('statsArea').innerHTML = `📊 إجمالي المدين: ${totalDebit.toFixed(2)} | إجمالي الدائن: ${totalCredit.toFixed(2)} | إجمالي الرصيد: ${totalBalance.toFixed(2)} | عدد العملاء: ${clients.length}`;
            document.getElementById('statsArea').style.display = 'flex';
            
            return true;
            
        } catch (err) {
            console.error(err);
            showStatus(`❌ خطأ: ${err.message}`, 'error');
            return false;
        }
    }
    
    function displayTable(clients) {
        const container = document.getElementById('tablePreview');
        if (!clients || clients.length === 0) {
            container.innerHTML = '<div style="padding: 50px; text-align: center;">📭 لا توجد بيانات</div>';
            return;
        }
        
        let html = '<table dir="rtl"><thead><tr><th>#</th><th>رقم العميل</th><th>اسم العميل</th><th>مدين (YER)</th><th>دائن (YER)</th><th>الرصيد (YER)</th></tr></thead><tbody>';
        
        clients.forEach((c, idx) => {
            html += `<tr>
                        <td>${idx + 1}</td>
                        <td>${escapeHtml(c["رقم العميل"])}</td>
                        <td>${escapeHtml(c["اسم العميل"])}</td>
                        <td style="text-align:left">${c["مدين (YER)"].toFixed(2)}</td>
                        <td style="text-align:left">${c["دائن (YER)"].toFixed(2)}</td>
                        <td style="text-align:left">${c["الرصيد (YER)"].toFixed(2)}</td>
                      </tr>`;
        });
        
        html += '</tbody></table>';
        container.innerHTML = html;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    function exportToExcel() {
        if (!clientsData || clientsData.length === 0) {
            showStatus('لا توجد بيانات للتصدير', 'error');
            return;
        }
        
        const sheetData = [["رقم العميل", "اسم العميل", "مدين (YER)", "دائن (YER)", "الرصيد (YER)"]];
        let totalDebit = 0, totalCredit = 0, totalBalance = 0;
        
        for (let c of clientsData) {
            sheetData.push([c["رقم العميل"], c["اسم العميل"], c["مدين (YER)"], c["دائن (YER)"], c["الرصيد (YER)"]]);
            totalDebit += c["مدين (YER)"];
            totalCredit += c["دائن (YER)"];
            totalBalance += c["الرصيد (YER)"];
        }
        
        sheetData.push(["", "الإجمالي", totalDebit, totalCredit, totalBalance]);
        
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        ws['!cols'] = [{wch:12}, {wch:35}, {wch:16}, {wch:16}, {wch:16}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "العملاء");
        XLSX.writeFile(wb, `${fileName || "report"}_clients.xlsx`);
        
        showStatus(`✅ تم التصدير! تم حفظ ${clientsData.length} عميل`, 'success');
    }
    
    function clearAll() {
        clientsData = [];
        fileName = "";
        document.getElementById('tablePreview').innerHTML = '<div style="padding: 50px; text-align: center;">📭 تم المسح، اختر ملف PDF جديد</div>';
        document.getElementById('statsArea').style.display = 'none';
        document.getElementById('convertBtn').disabled = true;
        document.getElementById('fileInput').value = '';
        showStatus('🗑️ تم مسح جميع البيانات.', 'info');
    }
    
    // الأحداث
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) processPDF(e.target.files[0]);
    });
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#1a7f64';
        dropZone.style.background = '#f0fdf9';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafcff';
    });
    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafcff';
        const files = e.dataTransfer.files;
        if (files.length && files[0].type === 'application/pdf') {
            await processPDF(files[0]);
        } else {
            showStatus('❌ يرجى إسقاط ملف PDF فقط', 'error');
        }
    });
    
    document.getElementById('convertBtn').addEventListener('click', exportToExcel);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
</script>
</body>
</html>
