<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول PDF إلى Excel - النسخة النهائية</title>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0a3c32, #1a7f64);
            color: white;
            padding: 28px 32px;
        }
        .header h1 { margin: 0 0 8px; font-size: 1.8rem; }
        .content { padding: 32px; }
        .upload-area {
            background: #fafcff;
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .upload-area:hover { border-color: #1a7f64; background: #f0fdf9; }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        button {
            background: #1a7f64;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0e5e48; transform: translateY(-1px); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #475569; }
        .btn-danger { background: #dc2626; }
        .status {
            background: #f1f5f9;
            padding: 14px 20px;
            border-radius: 16px;
            margin: 16px 0;
            border-right: 4px solid #1a7f64;
        }
        .status.error { border-right-color: #dc2626; background: #fef2f2; }
        .status.success { border-right-color: #22c55e; background: #f0fdf4; }
        .preview-table {
            overflow-x: auto;
            max-height: 550px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            text-align: right;
        }
        th {
            background: #f1f5f9;
            position: sticky;
            top: 0;
        }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 16px;
        }
        .raw-text {
            background: #1e1e2e;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-size: 11px;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 300px;
            display: none;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📄 محول PDF إلى Excel</h1>
        <p>لجداول العملاء (المستخدمة في عيادات الأسنان)</p>
    </div>
    <div class="content">
        <div class="upload-area" id="dropZone">
            <div style="font-size: 56px; margin-bottom: 12px;">📂</div>
            <div style="font-weight: 600;">اسحب ملف PDF هنا أو انقر للاختيار</div>
            <div style="font-size: 13px; margin-top: 8px; color: #64748b;">✅ يدعم الملفات: A_MOVMENT_C_ALL_SUMMERY.pdf و A_MOVMENT_SUM4ERY.pdf</div>
            <input type="file" id="fileInput" accept=".pdf" style="display: none;">
        </div>
        
        <div class="btn-group">
            <button id="convertBtn" disabled>📊 تصدير إلى Excel</button>
            <button id="sampleBtn" class="btn-secondary">📋 تحميل بيانات تجريبية</button>
            <button id="clearBtn" class="btn-danger">🗑 مسح</button>
            <button id="debugBtn" class="btn-secondary" style="background:#334155;">🔍 عرض النص الخام</button>
        </div>
        
        <div id="statusMsg" class="status">✔️ جاهز. اختر ملف PDF.</div>
        
        <div class="preview-table" id="tablePreview">
            <div style="padding: 50px; text-align: center; color: #94a3b8;">📭 سيظهر الجدول بعد رفع الملف</div>
        </div>
        <div id="statsArea" class="stats" style="display: none;"></div>
        <div id="rawTextArea" class="raw-text"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    
    let extractedData = [];
    let currentFileName = "";
    let rawText = "";
    
    function showStatus(msg, type = 'info') {
        const el = document.getElementById('statusMsg');
        el.innerHTML = msg;
        el.className = `status ${type === 'error' ? 'error' : (type === 'success' ? 'success' : '')}`;
    }
    
    // تحويل الأرقام العربية
    function toEnglishNumber(str) {
        if (!str) return "0";
        const arabicDigits = '٠١٢٣٤٥٦٧٨٩';
        const persianDigits = '۰۱۲۳۴۵۶۷۸۹';
        let result = str.toString();
        for (let i = 0; i < 10; i++) {
            result = result.replace(new RegExp(arabicDigits[i], 'g'), i.toString());
            result = result.replace(new RegExp(persianDigits[i], 'g'), i.toString());
        }
        return result;
    }
    
    function parseNumber(str) {
        if (!str) return 0;
        let cleaned = toEnglishNumber(str.trim());
        cleaned = cleaned.replace(/,/g, '').replace(/٬/g, '');
        let match = cleaned.match(/-?\d+(?:\.\d+)?/);
        if (!match) return 0;
        let num = parseFloat(match[0]);
        return isNaN(num) ? 0 : num;
    }
    
    // استخراج البيانات من النص الخام باستخدام أنماط متعددة
    function extractFromRawText(text) {
        const clients = [];
        
        // النمط 1: مطابقة الصفوف التي تبدأ برقم وتنتهي بثلاثة أرقام
        // هذا النمط يعمل مع الملف الأول A_MOVMENT_C_ALL_SUMMERY.pdf
        const pattern1 = /(\d+)\s+([\u0600-\u06FF\u0750-\u077F\s\.\-\(\)\/]+?)\s+(-?[\d,\.]+)\s+(-?[\d,\.]+)\s+(-?[\d,\.]+)/g;
        
        let match;
        while ((match = pattern1.exec(text)) !== null) {
            let clientId = match[1];
            let name = match[2].trim();
            let debit = parseNumber(match[3]);
            let credit = parseNumber(match[4]);
            let balance = parseNumber(match[5]);
            
            // تنظيف الاسم
            name = name.replace(/\s+/g, ' ').trim();
            
            // تجاهل السطور غير المرغوب فيها
            const skipNames = ['اجمالي', 'الإجمالي', 'الرصيد', 'مدين', 'دائن', 'صفحة', 'Page'];
            let shouldSkip = false;
            for (let s of skipNames) {
                if (name.includes(s) || name === s) {
                    shouldSkip = true;
                    break;
                }
            }
            
            if (!shouldSkip && name.length > 1 && name.length < 80 && clientId.length < 10) {
                // تجنب التكرار
                const exists = clients.some(c => c["رقم العميل"] === clientId && c["اسم العميل"] === name);
                if (!exists) {
                    clients.push({
                        "رقم العميل": clientId,
                        "اسم العميل": name,
                        "مدين (YER)": debit,
                        "دائن (YER)": credit,
                        "الرصيد (YER)": balance
                    });
                }
            }
        }
        
        // إذا لم نجد شيئاً، جرب طريقة تقسيم السطور
        if (clients.length === 0) {
            const lines = text.split(/\r?\n/);
            for (let line of lines) {
                line = line.trim();
                if (line.length < 15) continue;
                
                // تخطي السطور التي تحتوي كلمات ممنوعة
                if (line.includes('اجمالي') || line.includes('الإجمالي') || 
                    line.includes('Page') || line.includes('المدير') ||
                    line.includes('تلفون') || line.includes('فاكس')) {
                    continue;
                }
                
                let parts = line.split(/\s+/);
                if (parts.length >= 5) {
                    let firstNum = parseNumber(parts[0]);
                    if (firstNum > 0 || parts[0] === '0') {
                        let lastThree = parts.slice(-3);
                        let nums = lastThree.map(p => parseNumber(p));
                        if (nums.every(n => !isNaN(n))) {
                            let nameParts = parts.slice(1, -3);
                            let name = nameParts.join(' ');
                            name = name.replace(/[`~!@#$%^&*()_+=[\]{};':"\\|,.<>?]/g, '').trim();
                            
                            const skipWords = ['الرصيد', 'مدين', 'دائن', 'اجمالي'];
                            let isBad = false;
                            for (let sw of skipWords) {
                                if (name === sw || name.includes(sw)) {
                                    isBad = true;
                                    break;
                                }
                            }
                            
                            if (!isBad && name.length > 1 && name.length < 80) {
                                clients.push({
                                    "رقم العميل": parts[0],
                                    "اسم العميل": name,
                                    "مدين (YER)": nums[0],
                                    "دائن (YER)": nums[1],
                                    "الرصيد (YER)": nums[2]
                                });
                            }
                        }
                    }
                }
            }
        }
        
        // إزالة التكرارات
        const unique = [];
        const seen = new Set();
        for (let c of clients) {
            const key = `${c["رقم العميل"]}|${c["اسم العميل"]}`;
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(c);
            }
        }
        
        return unique;
    }
    
    async function processPDF(file) {
        if (!file || file.type !== 'application/pdf') {
            showStatus('❌ يرجى اختيار ملف PDF صالح', 'error');
            return false;
        }
        
        showStatus(`⏳ جاري معالجة: ${file.name} ...`);
        
        try {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageText = content.items.map(item => item.str).join(' ');
                fullText += pageText + '\n';
            }
            
            rawText = fullText;
            document.getElementById('rawTextArea').innerHTML = fullText.substring(0, 2000) + '...';
            
            let clients = extractFromRawText(fullText);
            
            if (clients.length === 0) {
                showStatus('⚠️ لم يتم العثور على بيانات. تأكد أن الملف يحتوي على جدول عملاء.', 'error');
                document.getElementById('tablePreview').innerHTML = '<div style="padding: 50px; text-align: center;">❌ لم يتم العثور على بيانات</div>';
                document.getElementById('statsArea').style.display = 'none';
                document.getElementById('convertBtn').disabled = true;
                return false;
            }
            
            extractedData = clients;
            currentFileName = file.name.replace(/\.pdf$/i, '');
            
            displayTable(clients);
            showStatus(`✅ تم استخراج ${clients.length} عميل بنجاح!`, 'success');
            document.getElementById('convertBtn').disabled = false;
            
            const totalDebit = clients.reduce((s, c) => s + c["مدين (YER)"], 0);
            const totalCredit = clients.reduce((s, c) => s + c["دائن (YER)"], 0);
            const totalBalance = clients.reduce((s, c) => s + c["الرصيد (YER)"], 0);
            document.getElementById('statsArea').innerHTML = `📊 إجمالي المدين: ${totalDebit.toFixed(2)} | إجمالي الدائن: ${totalCredit.toFixed(2)} | إجمالي الرصيد: ${totalBalance.toFixed(2)} | عدد العملاء: ${clients.length}`;
            document.getElementById('statsArea').style.display = 'flex';
            
            return true;
            
        } catch (err) {
            console.error(err);
            showStatus(`❌ خطأ: ${err.message}`, 'error');
            return false;
        }
    }
    
    function displayTable(clients) {
        const container = document.getElementById('tablePreview');
        if (!clients || clients.length === 0) {
            container.innerHTML = '<div style="padding: 50px; text-align: center;">📭 لا توجد بيانات</div>';
            return;
        }
        
        let html = '<table dir="rtl"><thead><tr><th>#</th><th>رقم العميل</th><th>اسم العميل</th><th>مدين (YER)</th><th>دائن (YER)</th><th>الرصيد (YER)</th></tr></thead><tbody>';
        
        clients.slice(0, 50).forEach((c, idx) => {
            html += `<tr>
                        <td>${idx + 1}</td>
                        <td>${escapeHtml(c["رقم العميل"])}</td>
                        <td>${escapeHtml(c["اسم العميل"])}</td>
                        <td style="text-align:left">${c["مدين (YER)"].toFixed(2)}</td>
                        <td style="text-align:left">${c["دائن (YER)"].toFixed(2)}</td>
                        <td style="text-align:left">${c["الرصيد (YER)"].toFixed(2)}</td>
                      </tr>`;
        });
        
        html += '</tbody></table>';
        if (clients.length > 50) {
            html += `<div style="padding: 12px; background: #f8fafc; text-align: center;">+ ${clients.length - 50} صف إضافي</div>`;
        }
        container.innerHTML = html;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    function exportToExcel() {
        if (!extractedData || extractedData.length === 0) {
            showStatus('لا توجد بيانات للتصدير', 'error');
            return;
        }
        
        const sheetData = [["رقم العميل", "اسم العميل", "مدين (YER)", "دائن (YER)", "الرصيد (YER)"]];
        let totalDebit = 0, totalCredit = 0, totalBalance = 0;
        
        for (let c of extractedData) {
            sheetData.push([c["رقم العميل"], c["اسم العميل"], c["مدين (YER)"], c["دائن (YER)"], c["الرصيد (YER)"]]);
            totalDebit += c["مدين (YER)"];
            totalCredit += c["دائن (YER)"];
            totalBalance += c["الرصيد (YER)"];
        }
        
        sheetData.push(["", "الإجمالي", totalDebit, totalCredit, totalBalance]);
        
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        ws['!cols'] = [{wch:12}, {wch:35}, {wch:16}, {wch:16}, {wch:16}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "العملاء");
        XLSX.writeFile(wb, `${currentFileName || "report"}_clients.xlsx`);
        
        showStatus(`✅ تم التصدير! تم حفظ ${extractedData.length} عميل`, 'success');
    }
    
    function loadSampleData() {
        extractedData = [
            {"رقم العميل":"6","اسم العميل":"عبدالله المروسي","مدين (YER)":2250,"دائن (YER)":0,"الرصيد (YER)":2250},
            {"رقم العميل":"12","اسم العميل":"عبدالله الحكيمي","مدين (YER)":3000,"دائن (YER)":3000,"الرصيد (YER)":-3000},
            {"رقم العميل":"51","اسم العميل":"ناصر العتمي","مدين (YER)":2500,"دائن (YER)":2000,"الرصيد (YER)":2500},
            {"رقم العميل":"63","اسم العميل":"وليد الزماني","مدين (YER)":0,"دائن (YER)":2600,"الرصيد (YER)":-2600},
            {"رقم العميل":"93","اسم العميل":"عبدالله شيبان","مدين (YER)":2400,"دائن (YER)":0,"الرصيد (YER)":2400},
            {"رقم العميل":"110","اسم العميل":"حسن الطباخ","مدين (YER)":8050,"دائن (YER)":0,"الرصيد (YER)":8050},
            {"رقم العميل":"146","اسم العميل":"لطف محمد قاسم","مدين (YER)":5820,"دائن (YER)":0,"الرصيد (YER)":5820},
            {"رقم العميل":"228","اسم العميل":"ام براءه","مدين (YER)":7500,"دائن (YER)":0,"الرصيد (YER)":7500},
            {"رقم العميل":"311","اسم العميل":"ام محمد ضمانة اختيار","مدين (YER)":3950,"دائن (YER)":0,"الرصيد (YER)":3950},
            {"رقم العميل":"315","اسم العميل":"محمد نجيب صاحب البطاط","مدين (YER)":5200,"دائن (YER)":0,"الرصيد (YER)":5200},
            {"رقم العميل":"322","اسم العميل":"مروان سيف","مدين (YER)":200,"دائن (YER)":0,"الرصيد (YER)":200}
        ];
        currentFileName = "sample_data";
        displayTable(extractedData);
        showStatus(`📋 تم تحميل ${extractedData.length} سجل تجريبي (من الملف الأول الفعلي)`, 'success');
        document.getElementById('convertBtn').disabled = false;
        document.getElementById('statsArea').innerHTML = `📊 إجمالي المدين: 39870 | إجمالي الدائن: 7600 | عدد العملاء: ${extractedData.length}`;
        document.getElementById('statsArea').style.display = 'flex';
    }
    
    function clearAll() {
        extractedData = [];
        currentFileName = "";
        rawText = "";
        document.getElementById('tablePreview').innerHTML = '<div style="padding: 50px; text-align: center;">📭 تم المسح، اختر ملف PDF جديد</div>';
        document.getElementById('statsArea').style.display = 'none';
        document.getElementById('convertBtn').disabled = true;
        document.getElementById('fileInput').value = '';
        document.getElementById('rawTextArea').style.display = 'none';
        showStatus('🗑️ تم مسح جميع البيانات.', 'info');
    }
    
    function toggleRawText() {
        const el = document.getElementById('rawTextArea');
        if (el.style.display === 'none') {
            el.style.display = 'block';
        } else {
            el.style.display = 'none';
        }
    }
    
    // الأحداث
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) processPDF(e.target.files[0]);
    });
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#1a7f64';
        dropZone.style.background = '#f0fdf9';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafcff';
    });
    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafcff';
        const files = e.dataTransfer.files;
        if (files.length && files[0].type === 'application/pdf') {
            await processPDF(files[0]);
        } else {
            showStatus('❌ يرجى إسقاط ملف PDF فقط', 'error');
        }
    });
    
    document.getElementById('convertBtn').addEventListener('click', exportToExcel);
    document.getElementById('sampleBtn').addEventListener('click', loadSampleData);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('debugBtn').addEventListener('click', toggleRawText);
</script>
</body>
</html>
