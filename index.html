<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل جدول Word إلى Excel - عيادة الأسنان</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', system-ui;
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0a3c32, #1a7f64);
            color: white;
            padding: 28px 32px;
        }
        .header h1 { margin: 0; font-size: 1.8rem; }
        .header p { margin: 8px 0 0; opacity: 0.9; }
        .content { padding: 32px; }
        .method-box {
            background: #f8fafc;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .method-box h3 {
            margin: 0 0 16px;
            color: #0a3c32;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        textarea {
            width: 100%;
            height: 300px;
            font-family: monospace;
            font-size: 13px;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            resize: vertical;
            direction: ltr;
            text-align: left;
        }
        textarea:focus {
            outline: none;
            border-color: #1a7f64;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        button {
            background: #1a7f64;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #0e5e48; }
        .btn-blue { background: #2563eb; }
        .btn-blue:hover { background: #1d4ed8; }
        .btn-gray { background: #64748b; }
        .preview-table {
            overflow-x: auto;
            max-height: 500px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            margin-top: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            text-align: right;
        }
        th {
            background: #f1f5f9;
            position: sticky;
            top: 0;
        }
        .stats {
            margin-top: 16px;
            padding: 12px 16px;
            background: #dcfce7;
            border-radius: 12px;
            color: #166534;
        }
        .info {
            background: #e0f2fe;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-right: 4px solid #0284c7;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📄 تحويل جدول Word إلى Excel</h1>
        <p>خاص بملفات عيادة الأسنان - تعز</p>
    </div>
    <div class="content">
        <div class="info">
            💡 <strong>طريقة الاستخدام:</strong><br>
            1. افتح ملف Word<br>
            2. حدد الجدول بالكامل (Ctrl+A داخل الجدول)<br>
            3. انسخ (Ctrl+C)<br>
            4. الصق في المربع أدناه (Ctrl+V)<br>
            5. اضغط "تحويل البيانات"
        </div>

        <div class="method-box">
            <h3>📋 الصق الجدول هنا</h3>
            <textarea id="pasteArea" placeholder="بعد نسخ الجدول من Word، الصقه هنا...

مثال للبيانات المتوقعة:
3	فيصل الوصابي	28,810.00	28,880.00	-70.00
2	فهمي أنور	42,350.00	42,350.00	0.00
4	ادم احمد العده	749,501.90	718,205.00	31,296.90"></textarea>
            <div class="btn-group">
                <button id="convertBtn" class="btn-blue">🔄 تحويل البيانات إلى جدول</button>
                <button id="exportBtn" disabled>📎 تصدير إلى Excel</button>
                <button id="clearBtn" class="btn-gray">🗑 مسح</button>
            </div>
        </div>

        <h3>📋 معاينة البيانات المستخرجة</h3>
        <div class="preview-table" id="tablePreview">
            <div style="padding: 50px; text-align: center; color: #94a3b8;">سيظهر الجدول هنا بعد التحويل</div>
        </div>
        <div id="statsArea" class="stats" style="display: none;"></div>
    </div>
</div>

<script>
    let currentData = [];
    
    // تحويل الأرقام من النص
    function parseNumber(str) {
        if (!str) return 0;
        let cleaned = str.toString().replace(/,/g, '').replace(/٬/g, '');
        let num = parseFloat(cleaned);
        return isNaN(num) ? 0 : num;
    }
    
    // تحليل النص الملصق
    function parsePastedText(text) {
        const lines = text.split(/\r?\n/);
        const clients = [];
        
        for (let line of lines) {
            line = line.trim();
            if (line.length < 10) continue;
            
            // تقسيم حسب المسافات أو التبويبات
            let parts = line.split(/\s+/);
            
            // تنسيق Word عادة: رقم | اسم | مدين | دائن | رصيد
            if (parts.length >= 5) {
                let clientId = parts[0].trim();
                let name = parts[1].trim();
                let debit = parseNumber(parts[2]);
                let credit = parseNumber(parts[3]);
                let balance = parseNumber(parts[4]);
                
                // التحقق من صحة البيانات
                if (clientId && name && name.length > 1 && name.length < 80) {
                    clients.push({
                        "رقم العميل": clientId,
                        "اسم العميل": name,
                        "مدين (YER)": debit,
                        "دائن (YER)": credit,
                        "الرصيد (YER)": balance
                    });
                }
            }
            // بعض الأسماء قد تحتوي على مسافات (مثل "عيادة الرضوان")
            else if (parts.length >= 5) {
                // محاولة استخراج أفضل
                let clientId = parts[0];
                let nameParts = [];
                let debit, credit, balance;
                
                // الاسم هو الأجزاء الوسطى
                for (let i = 1; i < parts.length - 3; i++) {
                    nameParts.push(parts[i]);
                }
                let name = nameParts.join(' ');
                debit = parseNumber(parts[parts.length - 3]);
                credit = parseNumber(parts[parts.length - 2]);
                balance = parseNumber(parts[parts.length - 1]);
                
                if (clientId && name && name.length > 1) {
                    clients.push({
                        "رقم العميل": clientId,
                        "اسم العميل": name,
                        "مدين (YER)": debit,
                        "دائن (YER)": credit,
                        "الرصيد (YER)": balance
                    });
                }
            }
        }
        
        // إزالة التكرارات
        const unique = [];
        const seen = new Set();
        for (let c of clients) {
            const key = `${c["رقم العميل"]}|${c["اسم العميل"]}`;
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(c);
            }
        }
        
        return unique;
    }
    
    function displayTable(data) {
        const container = document.getElementById('tablePreview');
        if (!data || data.length === 0) {
            container.innerHTML = '<div style="padding: 50px; text-align: center;">📭 لا توجد بيانات للعرض</div>';
            return;
        }
        
        let html = '<table dir="rtl"><thead><tr><th>#</th><th>رقم العميل</th><th>اسم العميل</th><th>مدين (YER)</th><th>دائن (YER)</th><th>الرصيد (YER)</th></tr></thead><tbody>';
        
        data.forEach((c, idx) => {
            html += `<tr>
                        <td>${idx + 1}</td>
                        <td>${escapeHtml(c["رقم العميل"])}</td>
                        <td>${escapeHtml(c["اسم العميل"])}</td>
                        <td style="text-align:left">${c["مدين (YER)"].toFixed(2)}</td>
                        <td style="text-align:left">${c["دائن (YER)"].toFixed(2)}</td>
                        <td style="text-align:left">${c["الرصيد (YER)"].toFixed(2)}</td>
                      </tr>`;
        });
        
        html += '</tbody></table>';
        container.innerHTML = html;
        
        // إحصائيات
        const totalDebit = data.reduce((s, c) => s + c["مدين (YER)"], 0);
        const totalCredit = data.reduce((s, c) => s + c["دائن (YER)"], 0);
        const totalBalance = data.reduce((s, c) => s + c["الرصيد (YER)"], 0);
        
        const statsDiv = document.getElementById('statsArea');
        statsDiv.innerHTML = `📊 إجمالي المدين: ${totalDebit.toFixed(2)} | إجمالي الدائن: ${totalCredit.toFixed(2)} | إجمالي الرصيد: ${totalBalance.toFixed(2)} | عدد العملاء: ${data.length}`;
        statsDiv.style.display = 'block';
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    function convertData() {
        const text = document.getElementById('pasteArea').value;
        if (!text.trim()) {
            alert("الرجاء لصق البيانات أولاً");
            return;
        }
        
        const data = parsePastedText(text);
        if (data.length === 0) {
            alert("لم يتم العثور على بيانات صالحة. تأكد من أنك نسخت الجدول بشكل صحيح من Word");
            return;
        }
        
        currentData = data;
        displayTable(data);
        document.getElementById('exportBtn').disabled = false;
    }
    
    function exportToExcel() {
        if (!currentData || currentData.length === 0) {
            alert("لا توجد بيانات للتصدير");
            return;
        }
        
        const sheetData = [["رقم العميل", "اسم العميل", "مدين (YER)", "دائن (YER)", "الرصيد (YER)"]];
        let totalDebit = 0, totalCredit = 0, totalBalance = 0;
        
        for (let c of currentData) {
            sheetData.push([c["رقم العميل"], c["اسم العميل"], c["مدين (YER)"], c["دائن (YER)"], c["الرصيد (YER)"]]);
            totalDebit += c["مدين (YER)"];
            totalCredit += c["دائن (YER)"];
            totalBalance += c["الرصيد (YER)"];
        }
        
        sheetData.push(["", "الإجمالي", totalDebit, totalCredit, totalBalance]);
        
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        ws['!cols'] = [{wch:12}, {wch:35}, {wch:16}, {wch:16}, {wch:16}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "العملاء");
        XLSX.writeFile(wb, `clients_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.xlsx`);
    }
    
    function clearAll() {
        document.getElementById('pasteArea').value = '';
        currentData = [];
        document.getElementById('tablePreview').innerHTML = '<div style="padding: 50px; text-align: center;">📭 تم المسح</div>';
        document.getElementById('statsArea').style.display = 'none';
        document.getElementById('exportBtn').disabled = true;
    }
    
    // الأحداث
    document.getElementById('convertBtn').addEventListener('click', convertData);
    document.getElementById('exportBtn').addEventListener('click', exportToExcel);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
</script>
</body>
</html>
