<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول PDF إلى Excel - عيادة الأسنان</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', 'Cairo', system-ui, sans-serif;
            margin: 0;
            padding: 24px 20px;
            color: #1e2a3e;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            padding: 20px 28px 36px;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #0b5e7e, #1e7e6c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .upload-area {
            background: #f9fbfd;
            border: 2px dashed #bdd3e8;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 25px;
            transition: 0.2s;
        }
        .upload-area:hover {
            border-color: #2c9b7a;
            background: #f1f9f5;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 20px 0;
            justify-content: center;
        }
        button {
            background: #1f6e5c;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 44px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        button.btn-outline {
            background: white;
            border: 1.5px solid #1f6e5c;
            color: #1f6e5c;
        }
        .status {
            background: #eef2ff;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin: 18px 0;
        }
        .preview-table {
            overflow-x: auto;
            max-height: 500px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            margin-top: 25px;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 8px 10px;
            text-align: right;
        }
        th {
            background: #ebf4f1;
            position: sticky;
            top: 0;
        }
        footer {
            font-size: 12px;
            text-align: center;
            margin-top: 35px;
            color: #5c6f87;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 محول PDF ➜ Excel</h1>
    <div class="upload-area" id="dropZone">
        <div style="font-size: 48px;">📂</div>
        <div>اسحب ملف PDF هنا أو انقر للاختيار</div>
        <div style="font-size: 13px; margin-top: 8px;">يدعم ملفات تقارير العملاء (مدين، دائن، رصيد)</div>
        <input type="file" id="fileInput" accept=".pdf" style="display: none;">
    </div>
    
    <div class="btn-group">
        <button id="convertBtn" disabled>📊 تصدير إلى Excel</button>
        <button id="sampleBtn" class="btn-outline">📋 تحميل بيانات تجريبية</button>
        <button id="clearBtn" class="btn-outline">🗑 مسح</button>
    </div>
    
    <div id="statusMsg" class="status">✅ جاهز. اختر ملف PDF.</div>
    <div class="preview-table" id="tablePreview">
        <div style="padding: 35px; text-align: center;">سيعرض الجدول هنا بعد تحميل الملف</div>
    </div>
    <footer>يدعم جميع ملفات PDF التي تحتوي جداول بأعمدة: رقم العميل، الاسم، مدين، دائن، رصيد</footer>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    
    let extractedRows = [];
    let currentFileName = "";
    
    // تحويل الأرقام العربية إلى إنجليزية
    function toEnglishNumber(str) {
        if (!str) return "0";
        const arabicDigits = '٠١٢٣٤٥٦٧٨٩';
        const englishDigits = '0123456789';
        let result = "";
        for (let ch of str) {
            const idx = arabicDigits.indexOf(ch);
            result += idx !== -1 ? englishDigits[idx] : ch;
        }
        return result;
    }
    
    // استخراج الأرقام من النص
    function extractNumber(text) {
        if (!text) return 0;
        let cleaned = toEnglishNumber(text.trim());
        cleaned = cleaned.replace(/,/g, '').replace(/٬/g, '');
        let match = cleaned.match(/-?\d+(?:\.\d+)?/);
        if (!match) return 0;
        let num = parseFloat(match[0]);
        return isNaN(num) ? 0 : num;
    }
    
    // استخراج الجداول من النص الخام للـ PDF
    function extractTablesFromText(text) {
        const rows = [];
        const lines = text.split(/\r?\n/);
        
        // الأنماط المختلفة للجداول
        const patterns = [
            /(\d+)\s+([\u0600-\u06FF\u0750-\u077F\s\.\-]+?)\s+([\d,\.٬]+)\s+([\d,\.٬]+)\s+([\d,\.٬\-]+)/,  // 4 أعمدة
            /(\d+)\s+([\u0600-\u06FF\u0750-\u077F\s\.\-]+?)\s+([\d,\.٬]+)\s+([\d,\.٬]+)\s+([\d,\.٬\-]+)\s*$/ // نهاية السطر
        ];
        
        for (let line of lines) {
            line = line.trim();
            
            // تخطي سطور غير البيانات
            if (line.length < 10) continue;
            if (line.includes('اجمالي') || line.includes('الرصيد الحالي') || 
                line.includes('المدير') || line.includes('Page') || line.includes('مدين')) continue;
            if (line.startsWith('===') || line.startsWith('---')) continue;
            
            for (let pattern of patterns) {
                let match = line.match(pattern);
                if (match) {
                    let clientId = match[1].trim();
                    let rawName = match[2].trim();
                    let debit = extractNumber(match[3]);
                    let credit = extractNumber(match[4]);
                    let balance = extractNumber(match[5]);
                    
                    // تنظيف الاسم
                    let cleanName = rawName.replace(/\s+/g, ' ').trim();
                    
                    if (cleanName.length > 0 && (debit !== 0 || credit !== 0 || balance !== 0)) {
                        rows.push({
                            "رقم العميل": clientId,
                            "اسم العميل": cleanName,
                            "مدين (YER)": debit,
                            "دائن (YER)": credit,
                            "الرصيد (YER)": balance
                        });
                    }
                    break;
                }
            }
        }
        
        // إزالة التكرارات
        const unique = [];
        const seen = new Set();
        for (let row of rows) {
            let key = `${row["رقم العميل"]}|${row["اسم العميل"]}`;
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(row);
            }
        }
        
        return unique;
    }
    
    // معالجة ملف PDF
    async function processPdf(file) {
        if (!file || file.type !== 'application/pdf') {
            document.getElementById('statusMsg').innerHTML = '❌ يرجى اختيار ملف PDF صالح.';
            return false;
        }
        
        document.getElementById('statusMsg').innerHTML = `⏳ جاري معالجة: ${file.name} ...`;
        
        try {
            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + "\n";
            }
            
            // استخراج البيانات
            const rows = extractTablesFromText(fullText);
            
            if (rows.length === 0) {
                document.getElementById('statusMsg').innerHTML = '⚠️ لم يتم العثور على جداول. تأكد من تنسيق الملف.';
                return false;
            }
            
            extractedRows = rows;
            currentFileName = file.name.replace(/\.pdf$/i, '');
            
            // عرض المعاينة
            displayPreview(rows);
            document.getElementById('statusMsg').innerHTML = `✅ تم استخراج ${rows.length} سجل بنجاح!`;
            document.getElementById('convertBtn').disabled = false;
            return true;
            
        } catch (error) {
            console.error(error);
            document.getElementById('statusMsg').innerHTML = `❌ خطأ: ${error.message}`;
            return false;
        }
    }
    
    // عرض المعاينة
    function displayPreview(rows) {
        const container = document.getElementById('tablePreview');
        if (!rows || rows.length === 0) {
            container.innerHTML = '<div style="padding: 35px; text-align: center;">لا توجد بيانات للعرض</div>';
            return;
        }
        
        let html = '<table dir="rtl"><thead><tr>';
        html += '<th>#</th><th>رقم العميل</th><th>اسم العميل</th><th>مدين</th><th>دائن</th><th>الرصيد</th>';
        html += '</tr></thead><tbody>';
        
        rows.slice(0, 30).forEach((row, idx) => {
            html += `<tr>
                        <td>${idx + 1}</td>
                        <td>${row["رقم العميل"]}</td>
                        <td>${row["اسم العميل"]}</td>
                        <td style="text-align:left">${row["مدين (YER)"].toFixed(2)}</td>
                        <td style="text-align:left">${row["دائن (YER)"].toFixed(2)}</td>
                        <td style="text-align:left">${row["الرصيد (YER)"].toFixed(2)}</td>
                     </tr>`;
        });
        
        html += '</tbody></table>';
        if (rows.length > 30) {
            html += `<div style="padding: 10px; background: #f1f5f9; text-align: center;">+ ${rows.length - 30} صف إضافي</div>`;
        }
        container.innerHTML = html;
    }
    
    // تصدير إلى Excel
    function exportToExcel() {
        if (!extractedRows || extractedRows.length === 0) {
            alert("لا توجد بيانات للتصدير");
            return;
        }
        
        const sheetData = [["رقم العميل", "اسم العميل", "مدين (YER)", "دائن (YER)", "الرصيد (YER)"]];
        let totalDebit = 0, totalCredit = 0, totalBalance = 0;
        
        for (let row of extractedRows) {
            sheetData.push([
                row["رقم العميل"],
                row["اسم العميل"],
                row["مدين (YER)"],
                row["دائن (YER)"],
                row["الرصيد (YER)"]
            ]);
            totalDebit += row["مدين (YER)"];
            totalCredit += row["دائن (YER)"];
            totalBalance += row["الرصيد (YER)"];
        }
        
        sheetData.push(["", "الإجمالي", totalDebit, totalCredit, totalBalance]);
        
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        ws['!cols'] = [{wch:12}, {wch:30}, {wch:14}, {wch:14}, {wch:14}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "العملاء");
        XLSX.writeFile(wb, `${currentFileName || "report"}_clients.xlsx`);
        
        document.getElementById('statusMsg').innerHTML = `✅ تم التصدير!`;
    }
    
    // تحميل بيانات تجريبية (محاكاة للملف الأول)
    function loadSampleData() {
        const sample = [
            {"رقم العميل":"6","اسم العميل":"عبدالله المروسي","مدين (YER)":2250,"دائن (YER)":0,"الرصيد (YER)":2250},
            {"رقم العميل":"12","اسم العميل":"عبدالله الحكيمي","مدين (YER)":3000,"دائن (YER)":3000,"الرصيد (YER)":-3000},
            {"رقم العميل":"51","اسم العميل":"ناصر العتمي","مدين (YER)":2500,"دائن (YER)":2000,"الرصيد (YER)":2500},
            {"رقم العميل":"93","اسم العميل":"عبدالله شيبان","مدين (YER)":2400,"دائن (YER)":0,"الرصيد (YER)":2400}
        ];
        extractedRows = sample;
        currentFileName = "sample_data";
        displayPreview(sample);
        document.getElementById('statusMsg').innerHTML = `📋 تم تحميل ${sample.length} سجل تجريبي`;
        document.getElementById('convertBtn').disabled = false;
    }
    
    // مسح البيانات
    function clearData() {
        extractedRows = [];
        currentFileName = "";
        document.getElementById('tablePreview').innerHTML = '<div style="padding: 35px; text-align: center;">تم المسح، اختر ملف PDF جديد</div>';
        document.getElementById('statusMsg').innerHTML = '🗑️ تم مسح البيانات. يمكنك الآن رفع ملف جديد.';
        document.getElementById('convertBtn').disabled = true;
        document.getElementById('fileInput').value = '';
    }
    
    // ربط الأحداث
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) processPdf(e.target.files[0]);
    });
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#2c9b7a';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#bdd3e8';
    });
    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#bdd3e8';
        const files = e.dataTransfer.files;
        if (files.length && files[0].type === 'application/pdf') {
            await processPdf(files[0]);
        } else {
            document.getElementById('statusMsg').innerHTML = '❌ يرجى إسقاط ملف PDF فقط.';
        }
    });
    
    document.getElementById('convertBtn').addEventListener('click', exportToExcel);
    document.getElementById('sampleBtn').addEventListener('click', loadSampleData);
    document.getElementById('clearBtn').addEventListener('click', clearData);
</script>
</body>
</html>
